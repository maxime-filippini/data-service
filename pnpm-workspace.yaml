onlyBuiltDependencies:
  - esbuild
  - workerd
allowBuilds:
  esbuild: true
  workerd: true
packages:
  - app
  - docs
# Matches pnpm 11's default (used in CI), so local installs resolve the same
# versions: nothing published in the last day.
minimumReleaseAge: 1440
# @effect/platform-node asks for platform-node-shared ^<its version>, which
# resolves to a release built for a newer effect; keep it on effect's version.
overrides:
  "@effect/platform-node-shared": 4.1.6
