# Checks every push. main deploys production; develop, feat/* and fix/*
# deploy the dev environment. D1 migrations run before each deploy.
name: Deploy

on:
  push:
    branches: [main, develop, "feat/**", "fix/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CLOUDFLARE_ACCOUNT_ID: 7161f73e7a5a97a5d2fe7ad26e7e28f9

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.23.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test

  deploy-dev:
    needs: check
    if: github.event_name != 'pull_request' && github.ref_name != 'main'
    runs-on: ubuntu-latest
    # Every branch shares the dev environment: deploy one at a time, latest wins.
    concurrency: deploy-dev
    environment:
      name: dev
      url: https://data-service-dev.maxime-filippini.workers.dev
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.23.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate:dev
      - run: pnpm deploy:dev

  deploy-prod:
    needs: check
    if: github.event_name != 'pull_request' && github.ref_name == 'main'
    runs-on: ubuntu-latest
    concurrency: deploy-prod
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.23.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate:remote
      - run: pnpm run deploy
