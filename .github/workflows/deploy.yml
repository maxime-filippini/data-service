# Checks the Worker and the Python containers on every push. main deploys
# production; develop, feat/* and fix/* deploy the dev environment. Each deploy
# applies D1 migrations, then builds the container images (processor and
# engine) and deploys them with the Worker.
name: Deploy

on:
  push:
    branches: [main, develop, "feat/**", "fix/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CLOUDFLARE_ACCOUNT_ID: 7161f73e7a5a97a5d2fe7ad26e7e28f9

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.23.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          # The runner's cached 22.x can be older than Astro's minimum.
          check-latest: true
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm dashboard:check
      - run: pnpm docs:build

  check-processor:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: containers/processor
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run ruff check src tests
      - run: uv run ruff format --check src tests
      - run: uv run pytest

  check-engine:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: containers/engine
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run ruff check src tests
      - run: uv run ruff format --check src tests
      - run: uv run pytest

  deploy-dev:
    needs: [check, check-processor, check-engine]
    if: github.event_name != 'pull_request' && github.ref_name != 'main'
    runs-on: ubuntu-latest
    # Every branch shares the dev environment: deploy one at a time, latest wins.
    concurrency: deploy-dev
    environment:
      name: dev
      url: https://data-service-dev.maximefilippini.me
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.23.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          # The runner's cached 22.x can be older than Astro's minimum.
          check-latest: true
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate:dev
      - run: pnpm deploy:dev

  deploy-prod:
    needs: [check, check-processor, check-engine]
    if: github.event_name != 'pull_request' && github.ref_name == 'main'
    runs-on: ubuntu-latest
    concurrency: deploy-prod
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.23.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          # The runner's cached 22.x can be older than Astro's minimum.
          check-latest: true
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate:remote
      - run: pnpm run deploy
